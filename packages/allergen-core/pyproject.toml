[project]
name = "snap-allergen-core"
version = "0.0.0"
description = "Allergen ontology and evidence-typed matcher (deterministic, auditable)."
requires-python = ">=3.12,<3.13"
dependencies = ["snap-shared-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snap_allergen_core"]
