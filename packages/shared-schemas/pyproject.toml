[project]
name = "snap-shared-schemas"
version = "0.0.0"
description = "Shared Pydantic models and enums (single source of truth for API contracts)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snap_shared_schemas"]
