[project]
name = "snap-api"
version = "0.0.0"
description = "SnapNutrition FastAPI backend (modular monolith)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "snap-shared-schemas",
    "snap-nutrition-core",
    "snap-allergen-core",
    "snap-preprocessing",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snap_api"]
