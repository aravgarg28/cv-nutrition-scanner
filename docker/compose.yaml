# Local development stack (T-003). One command: `docker compose -f docker/compose.yaml up -d`.
# Credentials here are DEV-ONLY and clearly non-secret; production uses managed
# secrets (docs/security/SECRET_MANAGEMENT.md). See docs/build/LOCAL_DEVELOPMENT.md.

name: snapnutrition

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap
    ports:
      # Override the host port if 5432 is taken: POSTGRES_HOST_PORT=5433 docker compose ... up
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sidecar: create the images bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/snap-images &&
      mc anonymous set none local/snap-images &&
      echo 'bucket ready';
      "
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://snap:snap@postgres:5432/snap
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: snap-images
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: auto
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Declared for later tasks; not started by default (ASYNC_JOB_DESIGN escape hatch).
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-c", "print('worker role is implemented in T-016')"]
    environment:
      ROLE: worker
      DATABASE_URL: postgresql+asyncpg://snap:snap@postgres:5432/snap
    depends_on:
      postgres:
        condition: service_healthy

  # Optional split-out OCR service; unused until profiling justifies it (INFERENCE_DEPLOYMENT).
  ocr:
    profiles: ["ocr"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-c", "print('OCR service split is optional; see docs/architecture/INFERENCE_DEPLOYMENT.md')"]

volumes:
  pgdata:
  miniodata:
